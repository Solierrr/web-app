server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rotas do SPA (ex.: /pt-BR) não existem como arquivos: devolvem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e service workers nunca ficam em cache, para um deploy novo valer na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
}
