name: Preview

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".storybook/**"
      - "src/**/*.stories.*"
      - "src/**/*.mdx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: Solierrr/.github/.github/workflows/preview-storybook.yml@main
    with:
      node-version: "22"
      test: ${{ github.event_name == 'pull_request' }}
      publish: ${{ github.event_name != 'pull_request' }}
